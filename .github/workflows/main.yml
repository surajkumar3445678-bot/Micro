name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build APK
        run: |
          ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -1)
          if [ -n "$ZIP" ]; then
            echo "Zip found: $ZIP"
            mkdir -p /tmp/proj
            unzip -q "$ZIP" -d /tmp/proj
            DIR=$(dirname "$(find /tmp/proj -name settings.gradle.kts | head -1)")
          else
            DIR=$(pwd)
          fi
          echo "Project folder: $DIR"
          cd "$DIR"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: GameMic-debug-apk
          path: out/app-debug.apk
